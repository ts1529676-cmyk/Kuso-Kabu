kind = "web"
previewPath = "/stock-judge/"
title = "株の好き嫌い.com"
version = "1.0.0"
id = "artifacts/stock-judge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/stock-judge/" ]
localPort = 22759

[services.development]
run = "pnpm --filter @workspace/stock-judge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stock-judge", "run", "build" ]
publicDir = "artifacts/stock-judge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22759"
BASE_PATH = "/stock-judge/"
